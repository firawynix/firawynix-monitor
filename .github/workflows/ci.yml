# CI do Firawynix Monitor: lint, testes no Windows (onde o app roda) e no Linux,
# teste de fumaça da interface num Windows de verdade e o .exe pronto para baixar
# (aba Actions → execução → Artifacts). A versão vai para Releases com o .exe — só se
# tudo acima passar — ao enviar a tag "v<versão>" (ex.: v3.2.0) ou ao rodar o workflow
# manualmente (Actions → CI → Run workflow) marcando "publicar": aí o GitHub cria a tag
# v<versão> (de core/__init__.py) no commit testado.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a versão de core/__init__.py em Releases (cria a tag v<versão>)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.8
      - run: ruff check .

  tests:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -ra

  ui-smoke:
    name: Interface no Windows (fumaça)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements.txt
      - run: python -u scripts/smoke_ui.py --out capturas --total 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-windows
          path: capturas/
          if-no-files-found: ignore

  build:
    name: Executável Windows (.exe)
    needs: [lint, tests]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm --clean FirawynixMonitor.spec
      - name: Fumaça do .exe (modo demonstração por 20 s)
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath dist\FirawynixMonitor.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 20
          $log = Join-Path $env:LOCALAPPDATA "FirawynixMonitor\logs\monitor.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($proc.HasExited) { throw "O executável encerrou sozinho (código $($proc.ExitCode))." }
          # O .exe "onefile" roda o app num processo filho: encerra os dois.
          Get-Process -Name FirawynixMonitor -ErrorAction SilentlyContinue | Stop-Process -Force
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Exceção não tratada" -Quiet)) {
            throw "Exceção não tratada no log do executável."
          }
      - name: Pacote para download
        shell: pwsh
        run: |
          Copy-Item servers.example.json, .env.example dist\
          Copy-Item docs\firawynix-volume-backup, docs\sudoers.example dist\
          (Get-FileHash dist\FirawynixMonitor.exe -Algorithm SHA256).Hash | Out-File dist\FirawynixMonitor.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FirawynixMonitor-windows
          path: dist/

  release:
    name: Publicar versão (Releases)
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publicar == 'true'
    needs: [build, ui-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versão, tag e notas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(python3 -c "import core; print(core.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$code" ]; then
              echo "::error::A tag $tag não corresponde à versão $code (core/__init__.py)."
              exit 1
            fi
          else
            tag="v$code"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::A versão $tag já foi publicada. Atualize __version__ em core/__init__.py."
              exit 1
            fi
          fi
          test -f "docs/releases/$tag.md" || { echo "::error::Faltam as notas docs/releases/$tag.md"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: FirawynixMonitor-windows
          path: pacote
      - name: Arquivos da versão
        run: |
          name="FirawynixMonitor-$TAG"
          cp pacote/FirawynixMonitor.exe "$name.exe"
          rm -f pacote/FirawynixMonitor.exe.sha256
          (cd pacote && zip -r -q "../$name-windows.zip" .)
          sha256sum "$name.exe" "$name-windows.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Criar a versão no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="FirawynixMonitor-$TAG"
          # Sem a tag no repositório (disparo manual), o GitHub a cria neste commit testado.
          gh release create "$TAG" "$name.exe" "$name-windows.zip" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Firawynix Monitor ${TAG#v}" \
            --notes-file "docs/releases/$TAG.md"
