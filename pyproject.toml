[project]
name = "firawynix-monitor"
version = "3.2.0"
description = "Monitor desktop (Windows) de servidores Linux e VPS via SSH: systemd, Docker/Podman, LXD, Compose, Kubernetes, VMs, segurança, SMART, endpoints e histórico."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108"]
